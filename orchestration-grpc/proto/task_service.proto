syntax = "proto3";

package taskservice;

// Service definition
service TaskExecutor {
  // Execute a task asynchronously with streaming responses
  // First response: ACK (task started)
  // Second response: RESULT (task completed)
  rpc ExecuteTaskAsync(TaskRequest) returns (stream TaskResponse);
  
  // Legacy synchronous method (kept for compatibility)
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);
}

// Request message
message TaskRequest {
  uint32 task_id = 1;
  string task_name = 2;
  string inputs_json = 3;  // JSON string with task inputs
  int32 priority = 4;
  string policy = 5;
}

// Response message
message TaskResponse {
  uint32 task_id = 1;
  string status = 2;       // "STARTED", "COMPLETED", "ERROR"
  string result_json = 3;  // JSON string with task outputs (empty for STARTED)
  string error_message = 4;
}
